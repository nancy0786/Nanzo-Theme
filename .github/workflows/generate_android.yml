name: Regenerate Android Folder

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          channel: stable
          cache: true

      - name: 🧠 Backup Project Files
        run: |
          mkdir backup
          cp -r lib backup/
          cp pubspec.yaml backup/
          if [ -d "assets" ]; then cp -r assets backup/; fi

      - name: ⚙️ Recreate Android Project
        run: |
          rm -rf android
          flutter create --platforms android .

      - name: ♻️ Restore Project Files
        run: |
          rm -rf lib
          cp -r backup/lib .
          cp backup/pubspec.yaml .
          if [ -d "backup/assets" ]; then cp -r backup/assets .; fi
          rm -rf backup

      - name: 📤 Commit and Push New Android Folder
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Force add the new android folder
          git add android/
          
          # Only commit if there are actual changes
          git commit -m "Fix: Regenerated native Android bridge via flutter create" || echo "No changes to commit"
          git push
